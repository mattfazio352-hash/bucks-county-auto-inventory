name: Nightly reindex (refresh index.json from master)

on:
  schedule:
    # ~2 hours after the nightly scrape (04:00 UTC) so the master is fresh.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  reindex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Reindex from master
        run: node scraper/reindex.js
      - name: Commit index + shards
        run: |
          git config user.name "inventory-bot"
          git config user.email "inventory-bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Nightly reindex: refresh index.json + shards from master"
            git push
          fi
