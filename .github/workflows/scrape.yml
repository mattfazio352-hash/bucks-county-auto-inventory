name: Nightly Bucks County inventory scrape

on:
  schedule:
    # UTC. 04:00 UTC is approx 11:00 PM-12:00 AM US Eastern (depends on DST).
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  # 1) Read dealers.json and expose the list of dealer ids as a job matrix.
  setup:
    runs-on: ubuntu-latest
    outputs:
      dealers: ${{ steps.ids.outputs.dealers }}
    steps:
      - uses: actions/checkout@v4
      - id: ids
        run: |
          echo "dealers=$(node -e "console.log(JSON.stringify(require('./scraper/dealers.json').dealers.map(d=>d.id)))")" >> "$GITHUB_OUTPUT"

  # 2) One parallel job per dealer -> writes data/dealers/<id>.json, uploaded as an artifact.
  scrape:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        dealer: ${{ fromJSON(needs.setup.outputs.dealers) }}
    env:
      CONCURRENCY: "6"
      MAX_PER_DEALER: "0"     # every vehicle for this dealer
      PHOTOS_PER_VEHICLE: "0" # every photo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Scrape ${{ matrix.dealer }}
        run: node scraper/scrape.js --dealer "${{ matrix.dealer }}"
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.dealer }}
          path: data/dealers/${{ matrix.dealer }}.json
          if-no-files-found: warn
          retention-days: 3

  # 3) Merge all shards into the master dataset + change log, then commit once.
  merge:
    needs: scrape
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/download-artifact@v4
        with:
          path: _artifacts
          pattern: shard-*
          merge-multiple: true
      - name: Stage shards
        run: |
          mkdir -p data/dealers
          cp -f _artifacts/*.json data/dealers/ 2>/dev/null || echo "no shards found"
      - name: Merge
        run: node scraper/merge.js
      - name: Commit dataset
        run: |
          git config user.name "inventory-bot"
          git config user.email "inventory-bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No inventory changes to commit."
          else
            git commit -m "Nightly inventory update $(date -u +%Y-%m-%d)"
            git push
          fi
